name: Android

# Отдельный workflow для Android-приложения: сборка APK без Gradle
# (aapt2 + javac + d8, см. android/build.sh) и unit-тесты чистой логики.
# Shell- и Python-проверки панели живут в ci.yml и здесь не дублируются.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit-тесты и APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Версии те же, что PLATFORM_VERSION и BUILD_TOOLS_VERSION в
      # android/build.sh. build.sh ищет SDK в SDK, ANDROID_HOME, ANDROID_SDK_ROOT
      # (SDK проверяется первым), поэтому ниже он прокидывается явно.
      #
      # Предустановленный на runner'е SDK используем напрямую, без
      # android-actions/setup-android@v3: тот шаг падал на интерактивном запросе
      # принятия лицензий (y/N) и для этой сборки не нужен. Лицензии принимаем
      # через yes, ошибки лицензий не валят сборку — нужные пакеты всё равно
      # ставятся явно.
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "Android SDK: $SDK"

      - name: Python для shellcheck
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить shellcheck
        run: |
          set -euo pipefail
          python -m pip install shellcheck-py==0.11.0.1
          shellcheck --version

      - name: shellcheck android/build.sh и android/tests
        run: shellcheck android/build.sh android/tests/*.sh

      # Скрипт не требует Android SDK: компилирует Logic.java и тест обычным
      # javac во временный каталог.
      - name: Unit-тесты чистой логики
        run: bash android/tests/run-unit-tests.sh

      - name: Сборка APK с временным keystore
        working-directory: android
        env:
          # Keystore создаётся только на runner'е и никуда не публикуется.
          # Пароль — заглушка, реальные секреты в публичном репозитории не нужны.
          KEYSTORE_PATH: ${{ runner.temp }}/android-ci/vpnswitch.keystore
          KEYSTORE_PASS: ci-placeholder-only
          INIT_KEYSTORE: "1"
        run: |
          set -euo pipefail
          ./build.sh
          version_name="$(sed -n 's/^[[:space:]]*VERSION_NAME[[:space:]]*=[[:space:]]*//p' version.properties | tail -n 1)"
          echo "APK=dist/VpnSwitcher-$version_name.apk" >> "$GITHUB_ENV"

      - name: apksigner verify
        working-directory: android
        run: |
          set -euo pipefail
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: zipalign -c 4
        working-directory: android
        run: |
          set -euo pipefail
          "$SDK/build-tools/35.0.0/zipalign" -c 4 "$APK"

      - name: Сверить versionName и versionCode с version.properties
        working-directory: android
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*VERSION_NAME[[:space:]]*=[[:space:]]*//p' version.properties | tail -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*VERSION_CODE[[:space:]]*=[[:space:]]*//p' version.properties | tail -n 1)"
          [[ -n "$version_name" ]] || { echo "::error::VERSION_NAME пуст в version.properties"; exit 1; }
          [[ "$version_code" =~ ^[0-9]+$ ]] \
            || { echo "::error::VERSION_CODE должен быть числом в version.properties"; exit 1; }

          badging="$("$SDK/build-tools/35.0.0/aapt2" dump badging "$APK")"
          first_line="${badging%%$'\n'*}"
          echo "$first_line"

          grep -Fq "versionCode='$version_code'" <<<"$first_line" \
            || { echo "::error::в badging нет versionCode='$version_code'"; exit 1; }
          grep -Fq "versionName='$version_name'" <<<"$first_line" \
            || { echo "::error::в badging нет versionName='$version_name'"; exit 1; }

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: VpnSwitcher-apk
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 14
